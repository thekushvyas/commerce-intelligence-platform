version: 2

models:
  - name: dim_date
    description: Calendar dimension 2016-2018.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: date_key
        tests: [unique, not_null]
  - name: dim_customer
    description: One row per person (customer_unique_id) with lifetime metrics and acquisition cohort.
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: n_orders
        tests:
          - positive_values
  - name: dim_seller
    description: One row per seller with performance metrics and, where available, the marketing-funnel acquisition record.
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_geography
    columns:
      - name: zip_prefix
        tests: [unique, not_null]
      - name: lat
        tests: [not_null]
  - name: fact_orders
    description: Order-grain fact. GMV = item price + freight (what the customer pays).
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_unique_id}
      - name: gmv
        tests: [not_null]
      - name: purchase_date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
  - name: fact_order_items
    tests:
      - unique_combination:
          columns: ['order_id', 'order_item_id']
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('fact_orders'), field: order_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('dim_seller'), field: seller_id}
      - name: product_id
        tests:
          - relationships: {to: ref('dim_product'), field: product_id}
      - name: item_gmv
        tests: [positive_values]
  - name: fact_payments
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('fact_orders'), field: order_id}
  - name: fact_seller_funnel
    columns:
      - name: mql_id
        tests: [unique, not_null]
      - name: origin
        tests: [not_null]
  - name: rpt_sales_wide
    description: Order-line One Big Table for BI tools.
    tests:
      - unique_combination:
          columns: ['order_id', 'order_item_id']
