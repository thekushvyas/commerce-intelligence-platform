[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-intel"
version = "1.0.0"
description = "End-to-end commerce analytics platform on the Olist marketplace dataset: dbt + DuckDB warehouse, Python models, BI exports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kush Vyas"}]
dependencies = [
  "duckdb>=1.1", "dbt-core>=1.8", "dbt-duckdb>=1.8", "pandas>=2.2,<3.1", "numpy>=1.26", "pyarrow>=15",
  "scikit-learn>=1.5", "statsmodels>=0.14", "scipy>=1.12", "lifetimes>=0.11", "plotly>=5.20", "matplotlib>=3.8",
]

[project.optional-dependencies]
bi = ["tableauhyperapi>=0.0.19"]
dev = ["pytest>=8", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29", "jupyter_client>=8", "ruff>=0.5"]

[project.scripts]
commerce-intel = "commerce_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"
