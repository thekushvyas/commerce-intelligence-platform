name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: olist-raw-v1
      - name: Download + validate raw data
        run: make data
      - name: Build warehouse (dbt build = models + 59 tests)
        run: make warehouse
      - name: Run analyses
        run: make analyze
      - name: Unit + reconciliation tests
        run: make test
      - name: Build dashboard
        run: make report
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/dashboard.html
            reports/results.json
            reports/figures
          retention-days: 14
